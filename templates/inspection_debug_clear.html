{% extends 'base.html' %}
{% block content %}<h1>清除測試資料</h1><section class="panel"><p class="warning">此功能只供除錯。執行前會先建立驗證過的資料庫備份。</p><form method="post"><label class="check"><input type="checkbox" name="items" value="orders">訂單、條碼與缺料紀錄（{{ counts.inspection_order }} 筆訂單、{{ counts.inspection_barcode_record }} 筆條碼、{{ counts.inspection_material_pause }} 筆缺料紀錄）</label><label class="check"><input type="checkbox" name="items" value="scans">掃描紀錄（{{ counts.inspection_scan_event }} 筆）</label><label class="check"><input type="checkbox" name="items" value="workers">校機人員（{{ counts.inspection_worker }} 人）</label><label class="check"><input type="checkbox" name="items" value="models">機型（{{ counts.inspection_model_master }} 個）</label><label>確認文字<input name="confirmation" placeholder="輸入 清除"></label><button class="button danger">清除</button></form></section>{% endblock %}
