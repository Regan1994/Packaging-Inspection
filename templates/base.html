<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TJR 生產系統</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{% if request.path.startswith('/packing') %}{{ url_for('main.packing_scan_page') }}{% elif request.endpoint == 'main.index' %}{{ url_for('main.index') }}{% else %}{{ url_for('main.inspection_home') }}{% endif %}">TJR 生產系統</a>
    <nav class="admin-nav">
      {% block header_nav %}<a href="{{ url_for('main.index') }}">系統首頁</a><a href="{{ url_for('main.settings') }}">設定</a><a href="{{ url_for('main.debug_clear') }}">清除資料</a>{% endblock %}
    </nav>
  </header>
  <main class="container {% block container_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
